<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/markdown-site/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Personal blog by Daniel Simon Jr. Built with React and deployed on GitHub Pages."
    />
    <meta name="author" content="Daniel Simon Jr" />
    <meta
      name="keywords"
      content="blog, markdown, React, TypeScript, GitHub Pages"
    />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#faf8f5" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Daniel Simon Jr - Blog"
    />
    <meta
      property="og:description"
      content="Personal blog by Daniel Simon Jr."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://danielsimonjr.github.io/markdown-site/" />
    <meta property="og:site_name" content="Daniel Simon Jr" />
    <meta
      property="og:image"
      content="https://danielsimonjr.github.io/markdown-site/images/og-default.svg"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="danielsimonjr.github.io" />
    <meta property="twitter:url" content="https://danielsimonjr.github.io/markdown-site/" />
    <meta
      name="twitter:title"
      content="Daniel Simon Jr - Blog"
    />
    <meta
      name="twitter:description"
      content="Personal blog by Daniel Simon Jr."
    />
    <meta
      name="twitter:image"
      content="https://danielsimonjr.github.io/markdown-site/images/og-default.svg"
    />

    <!-- RSS Feeds -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS Feed"
      href="/markdown-site/rss.xml"
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS Feed (Full Content)"
      href="/markdown-site/rss-full.xml"
    />

    <!-- LLM and AI Discovery -->
    <link rel="author" href="/markdown-site/llms.txt" />

    <!-- JSON-LD Structured Data for Homepage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Daniel Simon Jr",
        "url": "https://danielsimonjr.github.io/markdown-site",
        "description": "Personal blog by Daniel Simon Jr.",
        "author": {
          "@type": "Person",
          "name": "Daniel Simon Jr",
          "url": "https://danielsimonjr.github.io"
        }
      }
    </script>

    <title>Daniel Simon Jr - Blog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
