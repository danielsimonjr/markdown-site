<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Daniel Simon Jr - Blog</title>
  <script>
    // Single Page App routing for GitHub Pages
    // Redirects all 404s to index.html with the path preserved
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    // Store the path to restore after redirect
    sessionStorage.setItem('redirect', path + search + hash);

    // Redirect to the base path
    window.location.replace('/blog/' + search + hash);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
